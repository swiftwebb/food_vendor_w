<main class="px-4 md:px-10 lg:px-20 xl:px-40 py-5">
<div class="flex flex-wrap gap-2 p-4">
<a class="text-gray-500 dark:text-gray-400 text-base font-medium leading-normal" href="#">Home</a>
<span class="text-gray-500 dark:text-gray-400 text-base font-medium leading-normal">/</span>
<a class="text-gray-500 dark:text-gray-400 text-base font-medium leading-normal" href="#">Cart</a>
<span class="text-gray-500 dark:text-gray-400 text-base font-medium leading-normal">/</span>
<span class="text-gray-800 dark:text-white text-base font-medium leading-normal">Checkout</span>
</div>
<div class="flex flex-wrap justify-between gap-3 p-4">
<p class="text-gray-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em] min-w-72">Checkout</p>
</div>
<div class="w-full max-w-5xl mx-auto mt-8 mb-12">

</div>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8 p-4">
<div class="lg:col-span-2">
<div class="bg-white dark:bg-background-dark rounded-xl shadow-sm p-6">
<h2 class="text-gray-900 dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] pb-3 pt-2">Shipping Address</h2>
<form class="space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block text-gray-800 dark:text-gray-300 text-sm font-medium pb-2" for="first-name">First Name</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal leading-normal" id="first-name" placeholder="Enter your first name" value=""/>
</div>
<div>
<label class="block text-gray-800 dark:text-gray-300 text-sm font-medium pb-2" for="last-name">Last Name</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal leading-normal" id="last-name" placeholder="Enter your last name" value=""/>
</div>
</div>
<div>
<label class="block text-gray-800 dark:text-gray-300 text-sm font-medium pb-2" for="address">Street Address</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal leading-normal" id="address" placeholder="123 Main St" value=""/>
</div>
<div>
<label class="block text-gray-800 dark:text-gray-300 text-sm font-medium pb-2" for="apartment">Apartment, suite, etc. (optional)</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal leading-normal" id="apartment" placeholder="Apt #4B" value=""/>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
<div>
<label class="block text-gray-800 dark:text-gray-300 text-sm font-medium pb-2" for="city">City</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal leading-normal" id="city" placeholder="New York" value=""/>
</div>
<div>
<label class="block text-gray-800 dark:text-gray-300 text-sm font-medium pb-2" for="state">State / Province</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal leading-normal" id="zip" placeholder="Lagos" value=""/>

</div>

</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

<div>
<label class="block text-gray-800 dark:text-gray-300 text-sm font-medium pb-2" for="phone">Phone Number</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal leading-normal" id="phone" placeholder="07065440961" type="tel" value=""/>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary" id="save-address" type="checkbox"/>
<label class="ml-2 block text-sm text-gray-800 dark:text-gray-300" for="save-address">Save this address for future orders</label>
</div>
</form>
</div>

<div class="mt-8 flex justify-between items-center">
<a  class="text-primary font-medium text-sm hover:underline" href="cart.html">
<span class="material-symbols-outlined align-middle text-base">arrow_back</span> Return to Cart
                            </a>
<a href="payment.html" class="flex min-w-[180px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">Continue to Payment</span>
</a>
</div>
</div>
<div class="lg:col-span-1">

</div>
</div>
</main>


<script>
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");
  
  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
  });
  
  document.addEventListener("click", (e) => {
    if (
      !menuBtn.contains(e.target) &&
      !mobileMenu.contains(e.target)
    ) {
      mobileMenu.classList.add("hidden");
    }
  });
  </script>
  
  
</div>
</div>
</body></html>
